<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>billy — notes editor</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/cms.css" />
  </head>
  <body>
    <nav>
      <a href="/">billy</a>
      <a href="/notes">notes</a>
    </nav>
    <main class="cms-grid">
      <section>
        <p class="cms-label">notes editor</p>
        <form id="note-form">
          <input type="hidden" id="original-slug" />

          <label>title
            <input id="title" required autocomplete="off" />
          </label>

          <label>slug
            <input id="slug" required pattern="[a-z0-9-]+" autocomplete="off" />
          </label>

          <label>date
            <input id="date" required pattern="\d{4}-\d{2}-\d{2}" placeholder="yyyy-mm-dd" autocomplete="off" />
          </label>

          <label>excerpt
            <textarea id="excerpt" rows="2"></textarea>
          </label>

          <label>body
            <textarea id="body" rows="12" required></textarea>
          </label>

          <div class="file-input-wrapper">
            <span class="file-input-label">upload media</span>
            <input id="media-file" type="file" accept="image/*,audio/*,video/*" class="file-input-hidden" />
            <label for="media-file" class="file-input-button">choose file</label>
          </div>

          <div class="link-entry">
            <label>link URL
              <input id="link-url" type="url" placeholder="https://example.com" autocomplete="off" />
            </label>
            <label>link label
              <input id="link-label" placeholder="related work" autocomplete="off" />
            </label>
            <button type="button" id="add-link">add link block</button>
          </div>

          <div id="media-list"></div>

          <div class="cms-actions">
            <button type="submit">publish</button>
            <button type="button" id="clear">new note</button>
          </div>
          <p id="status" role="status"></p>
        </form>
      </section>
      <aside>
        <p class="cms-label">saved notes</p>
        <div id="notes-list"></div>
        <p class="cms-label preview-label">preview</p>
        <article id="preview" aria-live="polite"></article>
      </aside>
    </main>
    <footer>Made with 🚛❤️ by Brandon</footer>
    <script src="/shared.js"></script>
    <script src="/cms.js"></script>
  </body>
</html>
